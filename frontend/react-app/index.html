<!doctype html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>allStay</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <style>
      /* ── allStay design tokens (light) ── */
      :root {
        /* Brand */
        --primary:        #2563EB;
        --primary-dark:   #1D4ED8;
        --primary-light:  #DBEAFE;
        /* Surfaces */
        --bg:             #F8FAFC;
        --surface:        #FFFFFF;
        --surface-bright: #FFFFFF;
        --surface-container-low: #F1F5F9;
        --surface-container:     #E8EAEF;
        /* Text */
        --text:           #0F172A;
        --text-secondary: #64748B;
        --text-tertiary:  #94A3B8;
        /* Borders */
        --border:         #E2E8F0;
        --border-strong:  #CBD5E1;
        /* Semantic */
        --success:        #16A34A;
        --success-bg:     #DCFCE7;
        --warning:        #D97706;
        --warning-bg:     #FEF3C7;
        --error:          #DC2626;
        --error-bg:       #FEE2E2;
        /* Radius / shadow */
        --radius-card:    12px;
        --radius-input:   8px;
        --radius-pill:    9999px;
        --shadow-card:    0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
        --shadow-hover:   0 4px 12px rgba(15,23,42,.08), 0 2px 4px rgba(15,23,42,.05);
        --shadow-cta:     0 10px 40px rgba(37,99,235,.25);
        --shadow-cta-hover: 0 14px 50px rgba(37,99,235,.35);
        /* Tailwind color tokens (referenced in config below) */
        --tw-surface:           #F8FAFC;
        --tw-surface-bright:    #FFFFFF;
        --tw-on-surface:        #0F172A;
        --tw-on-surface-var:    #64748B;
        --tw-outline-var:       #E2E8F0;
        --tw-surface-cont-low:  #F1F5F9;
        --tw-surface-cont-low2: #FFFFFF;
        --tw-surface-cont:      #E8EAEF;
      }

      /* ── Dark mode overrides ── */
      html.dark {
        --bg:             #0F172A;
        --surface:        #1E293B;
        --surface-bright: #1E293B;
        --surface-container-low: #263247;
        --surface-container:     #334155;
        --text:           #F1F5F9;
        --text-secondary: #94A3B8;
        --text-tertiary:  #64748B;
        --border:         #334155;
        --border-strong:  #475569;
        --primary-light:  rgba(37,99,235,.25);
        --success-bg:     rgba(22,163,74,.15);
        --warning-bg:     rgba(217,119,6,.15);
        --error-bg:       rgba(220,38,38,.15);
        --shadow-card:    0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
        --shadow-hover:   0 4px 12px rgba(0,0,0,.4), 0 2px 4px rgba(0,0,0,.3);
        /* Tailwind token overrides */
        --tw-surface:          #0F172A;
        --tw-surface-bright:   #1E293B;
        --tw-on-surface:       #F1F5F9;
        --tw-on-surface-var:   #94A3B8;
        --tw-outline-var:      #334155;
        --tw-surface-cont-low: #263247;
        --tw-surface-cont-low2:#1E293B;
        --tw-surface-cont:     #334155;
      }

      html.dark body { background-color: #0F172A; color: #F1F5F9; }

      /* ── Animations ── */
      @keyframes fadeUp   { from { opacity:0; transform:translateY(28px) } to { opacity:1; transform:translateY(0) } }
      @keyframes fadeIn   { from { opacity:0 } to { opacity:1 } }
      @keyframes slideDown{ from { opacity:0; transform:translateY(-12px) } to { opacity:1; transform:translateY(0) } }
      @keyframes scaleIn  { from { opacity:0; transform:scale(.94) } to { opacity:1; transform:scale(1) } }
      @keyframes shimmer  { 0%{background-position:-400px 0} 100%{background-position:400px 0} }
      @keyframes floatY   { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
      @keyframes pulseRing{ 0%{box-shadow:0 0 0 0 rgba(37,99,235,.4)} 70%{box-shadow:0 0 0 12px rgba(37,99,235,0)} 100%{box-shadow:0 0 0 0 rgba(37,99,235,0)} }
      @keyframes flipIn   { from{transform:rotateY(-180deg);opacity:0} to{transform:rotateY(0);opacity:1} }
      @keyframes spin     { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }


      .animate-fade-up     { animation: fadeUp .65s cubic-bezier(.22,1,.36,1) both; }
      .animate-fade-in     { animation: fadeIn .5s ease both; }
      .animate-slide-down  { animation: slideDown .4s cubic-bezier(.22,1,.36,1) both; }
      .animate-scale-in    { animation: scaleIn .45s cubic-bezier(.22,1,.36,1) both; }
      .animate-float       { animation: floatY 3.5s ease-in-out infinite; }
      .animate-pulse-ring  { animation: pulseRing 2s ease-out infinite; }
      .delay-100 { animation-delay:.1s } .delay-200 { animation-delay:.2s }
      .delay-300 { animation-delay:.3s } .delay-400 { animation-delay:.4s }
      .delay-500 { animation-delay:.5s } .delay-600 { animation-delay:.6s }

      /* ── Glass utilities ── */
      .glass      { background:rgba(255,255,255,.12); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.2); }
      .glass-dark { background:rgba(0,0,0,.25);       backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.1); }
      .text-gradient { background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,.7) 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }

      /* ── Sun glow animation ── */
      @keyframes sunGlow { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.14);opacity:.88} }
      .sun-glow { animation:sunGlow 4s ease-in-out infinite; }

      /* ── Ocean scene animations ── */
      @keyframes waveLeft  { from{transform:translateX(0)}    to{transform:translateX(-50%)} }
      @keyframes waveRight { from{transform:translateX(-50%)} to{transform:translateX(0)} }
      @keyframes oceanSparkle { 0%,100%{opacity:.04} 50%{opacity:.72} }
      @keyframes sunRise { 0%,100%{box-shadow:0 0 50px 24px rgba(254,243,199,.45),0 0 120px 60px rgba(254,243,199,.18)} 50%{box-shadow:0 0 72px 36px rgba(254,243,199,.62),0 0 160px 80px rgba(254,243,199,.26)} }
      @keyframes palmSway   { 0%,100%{transform:rotate(-2.5deg)} 50%{transform:rotate(2.5deg)} }
      @keyframes slowSpin   { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes birdFly    { 0%{transform:translateX(0) translateY(0px)} 25%{transform:translateX(26vw) translateY(-14px)} 55%{transform:translateX(58vw) translateY(-4px)} 80%{transform:translateX(88vw) translateY(-20px)} 100%{transform:translateX(118vw) translateY(-10px)} }
      @keyframes wingFlap   { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(-0.55)} }

      /* ── Card / image utilities ── */
      .card-hover { transition:transform .3s cubic-bezier(.22,1,.36,1),box-shadow .3s ease; }
      .card-hover:hover { transform:translateY(-6px); box-shadow:0 24px 48px rgba(0,0,0,.15); }
      .img-zoom img { transition:transform .6s cubic-bezier(.22,1,.36,1); }
      .img-zoom:hover img { transform:scale(1.07); }
      /* ── Material Symbols Class ── */
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined', sans-serif;
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }

      /* ── Design-system component classes (ah-*) ── */
      .ah-card { background:var(--surface); border-radius:var(--radius-card); box-shadow:var(--shadow-card); border:1px solid var(--border); }
      .ah-card-hover:hover { box-shadow:var(--shadow-hover); transform:translateY(-2px); transition:all .2s; }

      .ah-btn { display:inline-flex; align-items:center; gap:8px; padding:0 18px; height:40px; border-radius:var(--radius-input); font-weight:700; font-size:14px; cursor:pointer; transition:all .15s; border:1.5px solid transparent; }
      .ah-btn-sm { height:34px; padding:0 14px; font-size:13px; }
      .ah-btn-lg { height:48px; padding:0 24px; font-size:15px; }
      .ah-btn-block { width:100%; justify-content:center; }
      .ah-btn-primary { background:var(--primary); color:#fff; box-shadow:var(--shadow-cta); }
      .ah-btn-primary:hover { background:var(--primary-dark); box-shadow:var(--shadow-cta-hover); }
      .ah-btn-secondary { background:var(--surface); color:var(--text); border-color:var(--border-strong); }
      .ah-btn-secondary:hover { background:var(--bg); }
      .ah-btn-ghost { background:transparent; color:var(--text); border-color:transparent; }
      .ah-btn-ghost:hover { background:var(--bg); }
      .ah-btn-danger { background:var(--error); color:#fff; }
      .ah-btn-danger:hover { background:#b91c1c; }
      .ah-btn-pulse { animation:pulseRing 2s ease-out infinite; }

      .ah-input { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-input); font-size:14px; font-weight:500; color:var(--text); background:var(--surface); outline:none; transition:border-color .15s; font-family:inherit; }
      .ah-input:focus { border-color:var(--primary); }
      .ah-input.is-error { border-color:var(--error); }
      .ah-label { display:block; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-secondary); margin-bottom:6px; }
      .ah-help  { font-size:12px; font-weight:500; color:var(--text-secondary); margin-top:5px; display:block; }
      .ah-help.is-error { color:var(--error); }
      .ah-field { display:flex; flex-direction:column; }
      .ah-textarea { width:100%; padding:10px 14px; border:1.5px solid var(--border); border-radius:var(--radius-input); font-size:14px; font-weight:500; color:var(--text); background:var(--surface); outline:none; resize:vertical; font-family:inherit; }
      .ah-textarea:focus { border-color:var(--primary); }

      .ah-badge { display:inline-flex; align-items:center; padding:3px 10px; border-radius:var(--radius-pill); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; }
      .ah-badge-confirmed  { background:var(--success-bg); color:var(--success); }
      .ah-badge-pending    { background:var(--warning-bg); color:var(--warning); }
      .ah-badge-cancelled  { background:var(--error-bg); color:var(--error); }
      .ah-badge-completed  { background:var(--primary-light); color:var(--primary-dark); }

      .ah-stat { background:var(--surface); border-radius:var(--radius-card); border:1px solid var(--border); padding:20px; box-shadow:var(--shadow-card); }
      .ah-stat-icon { width:44px; height:44px; border-radius:10px; display:flex; align-items:center; justify-content:center; margin-bottom:14px; }
      .ah-stat-val { font-size:26px; font-weight:800; letter-spacing:-0.02em; color:var(--text); }
      .ah-stat-lbl { font-size:13px; font-weight:600; color:var(--text-secondary); margin-top:4px; }

      .ah-tabs { display:flex; gap:0; border-bottom:2px solid var(--border); }
      .ah-tab  { padding:10px 18px; font-size:14px; font-weight:700; color:var(--text-secondary); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:all .15s; background:none; }
      .ah-tab:hover { color:var(--text); }
      .ah-tab.is-active { color:var(--primary); border-bottom-color:var(--primary); }

      .ah-toggle { width:44px; height:24px; border-radius:12px; background:var(--border-strong); position:relative; cursor:pointer; transition:background .2s; flex-shrink:0; }
      .ah-toggle::after { content:''; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:9px; background:#fff; transition:transform .2s; box-shadow:0 1px 3px rgba(0,0,0,.2); }
      .ah-toggle.is-on { background:var(--primary); }
      .ah-toggle.is-on::after { transform:translateX(20px); }

      .ah-flip { perspective:1000px; }
      .ah-flip-inner { position:relative; transition:transform .55s cubic-bezier(.4,0,.2,1); transform-style:preserve-3d; }
      .ah-flip.is-flipped .ah-flip-inner { transform:rotateY(180deg); }
      .ah-flip-front, .ah-flip-back { backface-visibility:hidden; -webkit-backface-visibility:hidden; }
      .ah-flip-back { position:absolute; inset:0; transform:rotateY(180deg); background:var(--surface); border-radius:var(--radius-card); border:1px solid var(--border); padding:24px; display:flex; flex-direction:column; gap:14px; justify-content:center; box-shadow:var(--shadow-card); }

      .ah-avatar-upload { width:80px; height:80px; border-radius:50%; background:linear-gradient(135deg,var(--primary),#06B6D4); color:#fff; font-weight:800; font-size:22px; display:flex; align-items:center; justify-content:center; position:relative; cursor:pointer; }
      .ah-avatar-upload-overlay { position:absolute; inset:0; border-radius:50%; background:rgba(0,0,0,.5); opacity:0; transition:opacity .18s; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; color:#fff; font-size:11px; font-weight:700; }
      .ah-avatar-upload:hover .ah-avatar-upload-overlay { opacity:1; }

      .ah-check { display:flex; align-items:center; gap:10px; cursor:pointer; font-size:14px; font-weight:600; color:var(--text); }
      .ah-check-box { width:20px; height:20px; border-radius:6px; border:2px solid var(--border-strong); display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--surface); }
      .ah-check.is-checked .ah-check-box { background:var(--primary); border-color:var(--primary); color:#fff; }

      .ah-eyebrow { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--text-secondary); }
      .ah-h1 { font-size:32px; font-weight:800; letter-spacing:-0.02em; color:var(--text); }
      .ah-h2 { font-size:22px; font-weight:800; letter-spacing:-0.02em; color:var(--text); }
      .ah-h3 { font-size:17px; font-weight:700; color:var(--text); }
      .ah-muted { color:var(--text-secondary); font-weight:500; }

      .ah-skeleton { background:linear-gradient(90deg,var(--border) 25%,var(--border-strong) 50%,var(--border) 75%); background-size:400px 100%; animation:shimmer 1.6s infinite; border-radius:6px; }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width:6px; height:6px; }
      ::-webkit-scrollbar-track { background:transparent; }
      ::-webkit-scrollbar-thumb { background:var(--border-strong); border-radius:3px; }
      input[type=date]::-webkit-calendar-picker-indicator { opacity:.5; cursor:pointer; }

      /* ── Dark mode Tailwind surface overrides ── */
      html.dark .bg-white { background-color: var(--surface) !important; }
      html.dark .bg-surface-bright { background-color: var(--surface-bright) !important; }
      html.dark .bg-surface { background-color: var(--bg) !important; }
      html.dark .bg-surface-container-low { background-color: var(--surface-container-low) !important; }
      html.dark .bg-surface-container-lowest { background-color: var(--surface) !important; }
      html.dark .bg-surface-container { background-color: var(--surface-container) !important; }
      html.dark .text-on-surface { color: var(--text) !important; }
      html.dark .text-on-surface-variant { color: var(--text-secondary) !important; }
      html.dark .text-slate-900 { color: var(--text) !important; }
      html.dark .text-slate-700 { color: var(--text-secondary) !important; }
      html.dark .text-slate-600 { color: var(--text-secondary) !important; }
      html.dark .border-outline-variant\/30,
      html.dark .border-slate-100,
      html.dark .border-slate-200 { border-color: var(--border) !important; }
      html.dark .border-b { border-color: var(--border); }
      html.dark .border-t { border-color: var(--border); }
      html.dark .hover\:bg-surface-container-low:hover { background-color: var(--surface-container-low) !important; }
      html.dark .hover\:bg-slate-50:hover { background-color: var(--surface-container-low) !important; }
      html.dark .hover\:bg-red-50:hover { background-color: rgba(220,38,38,.1) !important; }
      html.dark select,
      html.dark input[type=date],
      html.dark input[type=text],
      html.dark input[type=email],
      html.dark input[type=password],
      html.dark input[type=tel],
      html.dark textarea { background-color: var(--surface); color: var(--text); }
    </style>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary:                    "#2563EB",
              "primary-dark":             "#1D4ED8",
              "primary-light":            "#DBEAFE",
              "background-light":         "#F8FAFC",
              "background-dark":          "#101922",
              /* CSS-variable-backed tokens — respond to dark mode automatically */
              "on-surface":               "var(--tw-on-surface)",
              "on-surface-variant":       "var(--tw-on-surface-var)",
              surface:                    "var(--tw-surface)",
              "surface-bright":           "var(--tw-surface-bright)",
              outline:                    "#CBD5E1",
              "outline-variant":          "var(--tw-outline-var)",
              "surface-container-low":    "var(--tw-surface-cont-low)",
              "surface-container-lowest": "var(--tw-surface-cont-low2)",
              "surface-container":        "var(--tw-surface-cont)",
            },
            fontFamily: {
              sans:    ["Plus Jakarta Sans", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
              display: ["Plus Jakarta Sans", "-apple-system", "BlinkMacSystemFont", "sans-serif"],
              mono:    ["JetBrains Mono", "ui-monospace", "monospace"],
            },
          },
        },
      };
    </script>
  </head>
  <body class="bg-surface text-on-surface" style="font-family:'Plus Jakarta Sans',sans-serif">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
