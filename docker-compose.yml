version: "3.9"

# One-command startup: docker compose up -d
# Requires a .env file — copy .env.example and fill in secrets.

services:

  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: hotel_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-replication.sh:/docker-entrypoint-initdb.d/init-replication.sh:ro
    networks:
      - hotel_network
    # Allow the replicator user to connect for streaming replication
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=5
        -c wal_keep_size=256
        -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── DB replica (streaming replication from primary) ─────────────────────────
  db_replica1:
    image: postgres:15
    container_name: hotel_db_replica1
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_replica1_data:/var/lib/postgresql/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_network
    # pg_basebackup streams a base backup from the primary then starts postgres
    # in hot-standby mode (read-only replica).
    # gosu drops from root → postgres user; postgres refuses to run as root.
    command: >
      bash -c "
        chown -R postgres:postgres /var/lib/postgresql/data
        if [ ! -f /var/lib/postgresql/data/pgdata/PG_VERSION ]; then
          until gosu postgres pg_basebackup -h db -D /var/lib/postgresql/data/pgdata -U replicator -Fp -Xs -P -R --slot=replica1_slot; do
            echo 'Waiting for primary to be ready for replication...'; sleep 3;
          done
        fi
        exec gosu postgres postgres -D /var/lib/postgresql/data/pgdata
      "
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── PgBouncer connection pooler ───────────────────────────────────────────────
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: hotel_pgbouncer
    restart: always
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 1000
      DEFAULT_POOL_SIZE: 25
      RESERVE_POOL_SIZE: 5
      SERVER_IDLE_TIMEOUT: 600
      LOG_CONNECTIONS: 0
      LOG_DISCONNECTIONS: 0
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p 5432 -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache (polyglot persistence — R5) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend replica 1 (R8 — load balancing) ─────────────────────────────────
  backend1:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hotel_backend1
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REPLICA_ID=1
    networks:
      - hotel_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/health`) || PathPrefix(`/metrics`) || PathPrefix(`/static`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=circuit-breaker,retry"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # Sticky sessions keep WS clients on the same replica during the transition
      # period before Redis Pub/Sub is fully battle-tested in production.
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.name=SERVERID"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.httponly=true"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Backend replica 2 (R8 — load balancing) ─────────────────────────────────
  backend2:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hotel_backend2
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REPLICA_ID=2
    networks:
      - hotel_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN:-localhost}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/health`) || PathPrefix(`/metrics`) || PathPrefix(`/static`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=circuit-breaker,retry"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.name=SERVERID"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.secure=true"
      - "traefik.http.services.backend.loadbalancer.sticky.cookie.httponly=true"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Traefik reverse proxy + SSL (replaces Nginx — R8) ───────────────────────
  # DOMAIN and ACME_EMAIL must be set in .env for production SSL.
  # For local dev, HTTPS is not required — traffic goes to port 80 directly.
  traefik:
    image: traefik:v3.1
    container_name: hotel_traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"   # Traefik dashboard — firewall this port in production
    environment:
      # Required only when using the letsencrypt-dns resolver (Cloudflare DNS-01 challenge).
      # Leave blank if using the default httpChallenge resolver.
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/letsencrypt
    networks:
      - hotel_network

  # ── Frontend static files (served by nginx behind Traefik) ──────────────────
  # Cloudflare (Phase 4) will replace this by serving the React SPA from the edge.
  nginx_static:
    image: nginx:1.25-alpine
    container_name: hotel_nginx_static
    restart: always
    volumes:
      - ./frontend/react-app/dist:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - hotel_network

  # ── MinIO object storage (Phase 3 — multi-replica avatar fix) ──────────────
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: hotel_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console — firewall in production
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000' 2>/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Celery worker (async task queue — R10) ──────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    container_name: hotel_celery_worker
    restart: always
    command: celery -A app.celery_app worker --loglevel=info --concurrency=8
    depends_on:
    #dbs 
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file: .env
    networks:
      - hotel_network

  # ── Celery Beat scheduler (ONE replica only — two = duplicate jobs) ──────────
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    container_name: hotel_celery_beat
    restart: always
    command: celery -A app.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - hotel_network

  # ── Flower — Celery task monitor (dev convenience) ───────────────────────────
  flower:
    build:
      context: .
      dockerfile: docker/Dockerfile.celery
    container_name: hotel_flower
    restart: always
    command: celery -A app.celery_app flower --port=5555
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - hotel_network

  # ── Meilisearch full-text search engine ─────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.7.3
    container_name: hotel_meilisearch
    restart: always
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - hotel_network
    healthcheck:
    #command part 
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Observability: Jaeger all-in-one (Phase 3 — distributed tracing) ────────
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: hotel_jaeger
    restart: always
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI — firewall in production
      - "4317:4317"     # OTLP gRPC receiver
    networks:
      - hotel_network

  # ── Observability: Prometheus (R12) ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: hotel_prometheus
    restart: always
    command:
    #config psrt
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hotel_network

  # ── Observability: Grafana (R12) ─────────────────────────────────────────────
  grafana:
  #gravena version
    image: grafana/grafana:10.4.0
    container_name: hotel_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - hotel_network

  # ── Observability: Loki log aggregation (R12) ────────────────────────────────
  loki:
    image: grafana/loki:3.3.2
    container_name: hotel_loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - hotel_network

  # ── Observability: Promtail (ships Docker logs → Loki) ──────────────────────
  promtail:
    #image part 
    image: grafana/promtail:3.3.2
    container_name: hotel_promtail
    restart: always
    volumes:
      - ./observability/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - hotel_network

  # ── Observability: postgres_exporter (R12) ──────────────────────────────────
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: hotel_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_network

  # ── Observability: redis_exporter (R12) ─────────────────────────────────────
  redis_exporter:
    image: oliver006/redis_exporter:v1.60.0
    container_name: hotel_redis_exporter
    restart: always
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - hotel_network

  # ── pgAdmin (dev convenience) ────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: hotel_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: sunnatakhmad@gmail.com
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_network
#volume part 
volumes:
  postgres_data:
  postgres_replica1_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:
  traefik_certs:
  meilisearch_data:
  minio_data:
#network psrt 
networks:
  hotel_network:
    driver: bridge
