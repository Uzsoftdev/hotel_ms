version: "3.9"

# One-command startup: docker compose up -d
# Requires a .env file — copy .env.example and fill in secrets.

services:

  # ── Database ────────────────────────────────────────────────────────────────
  db:
    image: postgres:15
    container_name: hotel_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache (polyglot persistence — R5) ───────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hotel_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend replica 1 (R8 — load balancing) ─────────────────────────────────
  backend1:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hotel_backend1
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REPLICA_ID=1
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Backend replica 2 (R8 — load balancing) ─────────────────────────────────
  backend2:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: hotel_backend2
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      - REPLICA_ID=2
    networks:
      - hotel_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Nginx API gateway + frontend (R8) ────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: hotel_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/react-app/dist:/usr/share/nginx/html:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
    networks:
      - hotel_network

  # ── Observability: Prometheus (R12) ─────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: hotel_prometheus
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - hotel_network

  # ── Observability: Grafana (R12) ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: hotel_grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - hotel_network

  # ── Observability: Loki log aggregation (R12) ────────────────────────────────
  loki:
    image: grafana/loki:2.9.5
    container_name: hotel_loki
    restart: always
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - hotel_network

  # ── Observability: Promtail (ships Docker logs → Loki) ──────────────────────
  promtail:
    image: grafana/promtail:2.9.5
    container_name: hotel_promtail
    restart: always
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    environment:
      - LOKI_URL=http://loki:3100/loki/api/v1/push
    networks:
      - hotel_network

  # ── pgAdmin (dev convenience) ────────────────────────────────────────────────
  pgadmin:
    image: dpage/pgadmin4
    container_name: hotel_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hotel_network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  loki_data:

networks:
  hotel_network:
    driver: bridge
