global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "azure_horizon_backend"
    static_configs:
      - targets: ["backend1:8000", "backend2:8000"]
    metrics_path: /metrics

  - job_name: "nginx"
    static_configs:
      - targets: ["nginx:9113"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]
