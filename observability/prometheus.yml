global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "allstay_backend"
    static_configs:
      - targets: ["backend1:8000", "backend2:8000"]
    metrics_path: /metrics

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]

  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]

  - job_name: "promtail"
    static_configs:
      - targets: ["promtail:9080"]
    metrics_path: /metrics
