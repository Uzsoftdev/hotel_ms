# Disable authentication for local/testing environment
auth_enabled: false

server:
  # HTTP API port for Loki
  http_listen_port: 3100
  # gRPC communication port
  grpc_listen_port: 9096

common:
  # Local instance address
  instance_addr: 127.0.0.1
  # Base storage path inside container/server
  path_prefix: /loki
  storage:
    filesystem:
      # Directory used to store log chunks
      chunks_directory: /loki/chunks
            # Directory used to store rule files
      rules_directory: /loki/rules
  
  # Single replica setup for standalone deployment
  replication_factor: 1
  ring:
  # Use in-memory key/value store
      # Suitable for development environments
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
      # Enable query result caching
        enabled: true
        # Maximum cache size in MB
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-01-01
      # Use TSDB storage backend
      store: tsdb
      # Store logs on local filesystem
      object_store: filesystem
      # Loki schema version
      schema: v13
      index:
      # Prefix for generated index files
        prefix: index_
                # Create indexes every 24 hours
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: false
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

compactor:
  working_directory: /loki/compactor
  retention_enabled: false
