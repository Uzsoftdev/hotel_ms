entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"

providers:
  swarm:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: hotel_hotel_network
    refreshSeconds: 15
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  # Default resolver — HTTP-01 challenge. Works without Cloudflare.
  letsencrypt:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

  # DNS-01 resolver — use this when the domain is proxied through Cloudflare
  # (HTTP challenge fails behind Cloudflare proxy). Set CF_API_TOKEN in .env
  # and switch router labels to: tls.certresolver=letsencrypt-dns
  letsencrypt-dns:
    acme:
      email: "${ACME_EMAIL}"
      storage: /letsencrypt/acme-dns.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"

api:
  dashboard: true
  insecure: true    # temporary — for debugging service discovery

log:
  level: WARN

accessLog: {}
