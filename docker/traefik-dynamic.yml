http:
  middlewares:
    minio-strip:
      stripPrefix:
        prefixes:
          - "/storage"

    circuit-breaker:
      circuitBreaker:
        expression: "NetworkErrorRatio() > 0.30 || ResponseCodeRatio(500, 600, 0, 600) > 0.25"

    retry:
      retry:
        attempts: 3
        initialInterval: 100ms

    www-redirect:
      redirectRegex:
        regex: "^https://www\\.allstay\\.rest/(.*)"
        replacement: "https://allstay.rest/${1}"
        permanent: true

  routers:
    backend:
      rule: "Host(`allstay.rest`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`) || PathPrefix(`/metrics`) || PathPrefix(`/static`))"
      entryPoints: ["websecure"]
      tls: {}
      service: backend-svc
      middlewares: ["www-redirect", "circuit-breaker", "retry"]
      priority: 10

    minio:
      rule: "Host(`allstay.rest`) && PathPrefix(`/storage`)"
      entryPoints: ["websecure"]
      tls: {}
      service: minio-svc
      middlewares: ["minio-strip"]
      priority: 20

    frontend:
      rule: "Host(`allstay.rest`) || Host(`www.allstay.rest`)"
      entryPoints: ["websecure"]
      tls: {}
      service: frontend-svc
      middlewares: ["www-redirect"]
      priority: 1

  services:
    backend-svc:
      loadBalancer:
        servers:
          - url: "http://hotel_backend:8000"
        passHostHeader: true

    frontend-svc:
      loadBalancer:
        servers:
          - url: "http://hotel_nginx_static:80"
        passHostHeader: true

    minio-svc:
      loadBalancer:
        servers:
          - url: "http://hotel_minio:9000"
        passHostHeader: false

# Certbot-issued certs (mounted at /certs, renewed monthly by certbot.yml)
tls:
  certificates:
    - certFile: /certs/cert.pem
      keyFile: /certs/key.pem
  stores:
    default:
      defaultCertificate:
        certFile: /certs/cert.pem
        keyFile: /certs/key.pem
