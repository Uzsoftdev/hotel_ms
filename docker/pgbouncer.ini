[databases]
hotel_primary  = host=db          port=5432 dbname=${POSTGRES_DB}
hotel_replica1 = host=db_replica1 port=5432 dbname=${POSTGRES_DB}

[pgbouncer]
listen_port         = 6432
listen_addr         = 0.0.0.0
auth_type           = md5
auth_file           = /etc/pgbouncer/userlist.txt

; transaction mode is required — session mode gives no benefit with
; DBSessionMiddleware (one session per request, held for the full request),
; and statement mode breaks explicit transactions in the app.
pool_mode           = transaction

max_client_conn     = 1000
default_pool_size   = 25
reserve_pool_size   = 5
server_idle_timeout = 600
log_connections     = 0
log_disconnections  = 0
