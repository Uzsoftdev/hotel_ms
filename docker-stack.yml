version: "3.9"

x-backend-common: &backend-common
  image: ${REGISTRY:-ghcr.io/uzsoftdev}/hotel-backend:${IMAGE_TAG:-latest}
  env_file: .env
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql://hotel_user:hotelpass123@164.92.193.226:5432/hotel_system}
  networks:
    - hotel_network

services:

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - hotel_network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 128M

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    <<: *backend-common
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${DOMAIN:-allstay.rest}`) && (PathPrefix(`/api`) || PathPrefix(`/ws`) || PathPrefix(`/docs`) || PathPrefix(`/redoc`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`) || PathPrefix(`/metrics`) || PathPrefix(`/static`))"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.backend.middlewares=www-redirect,circuit-breaker,retry"
      - "traefik.http.routers.backend.priority=10"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  # ── Celery worker ────────────────────────────────────────────────────────────
  celery_worker:
    image: ${REGISTRY:-ghcr.io/uzsoftdev}/hotel-celery:${IMAGE_TAG:-latest}
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hotel_user:hotelpass123@164.92.193.226:5432/hotel_system}
    networks:
      - hotel_network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── Celery Beat ──────────────────────────────────────────────────────────────
  celery_beat:
    image: ${REGISTRY:-ghcr.io/uzsoftdev}/hotel-celery:${IMAGE_TAG:-latest}
    command: celery -A app.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://hotel_user:hotelpass123@164.92.193.226:5432/hotel_system}
    networks:
      - hotel_network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.2"
          memory: 128M

  # ── Traefik ──────────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-sunnatakhmad@gmail.com}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./docker/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_certs:/letsencrypt
    networks:
      - hotel_network
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 128M

  # ── Frontend static ───────────────────────────────────────────────────────────
  nginx_static:
    image: nginx:1.25-alpine
    volumes:
      - /opt/hms/frontend:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN:-allstay.rest}`) || Host(`www.${DOMAIN:-allstay.rest}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.frontend.middlewares=www-redirect"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
    networks:
      - hotel_network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 64M

volumes:
  redis_data:
  traefik_certs:

networks:
  hotel_network:
    driver: overlay
    attachable: true
