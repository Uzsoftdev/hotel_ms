name: Force Reset Admin

on:
  workflow_dispatch:

jobs:
  force-reset:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/hms_prod
          chmod 600 ~/.ssh/hms_prod
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Force update DB via Postgres container
        run: |
          ssh -i ~/.ssh/hms_prod -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cat << 'EOF' > /tmp/reset.sql
          UPDATE users SET email='admin@allstay.com', hashed_password='\$2b\$12\$wkWfPB1tR1h.d2k1G.Thz.yl0IBD/u98pRcH9KT2zb2HDVG9ROngC' WHERE role='super_admin';
          UPDATE users SET email='staff@allstay.com', hashed_password='\$2b\$12\$RLtdFCeksM8zA7it.SKJbeXn/JQ44jgEklKdXCH/bnqmsCnwEW5wu' WHERE role='staff';
          EOF
          sudo docker run --rm --network host -v /tmp/reset.sql:/reset.sql postgres:16 psql \"postgresql://hotel_user:hotelpass123@127.0.0.1:5432/hotel_system\" -f /reset.sql
          "
