name: Reset Seed Credentials

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql + python3-bcrypt
        run: |
          sudo apt-get install -y postgresql-client python3-bcrypt

      - name: Generate bcrypt hashes
        run: |
          python3 - <<'EOF'
import bcrypt, os
pairs = [
    ("ADMIN_HASH",  "Admin@12345"),
    ("STAFF_HASH",  "Staff@12345"),
    ("GUEST_HASH",  "Guest@12345"),
]
for var, pw in pairs:
    h = bcrypt.hashpw(pw.encode(), bcrypt.gensalt(rounds=12)).decode()
    with open(os.environ["GITHUB_ENV"], "a") as f:
        f.write(f"{var}={h}\n")
    print(f"{var} generated")
EOF

      - name: Show current users (before reset)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -h "${{ secrets.DB_HOST }}" -p "${{ secrets.DB_PORT }}" \
               -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" \
               -c "SELECT id, email, role, is_email_verified FROM users ORDER BY role;"

      - name: Reset credentials
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -h "${{ secrets.DB_HOST }}" -p "${{ secrets.DB_PORT }}" \
               -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" \
               -c "UPDATE users SET email='admin@allstay.rest', hashed_password='${{ env.ADMIN_HASH }}', is_email_verified=true WHERE role='super_admin';"
          psql -h "${{ secrets.DB_HOST }}" -p "${{ secrets.DB_PORT }}" \
               -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" \
               -c "UPDATE users SET email='staff@allstay.com', hashed_password='${{ env.STAFF_HASH }}', is_email_verified=true WHERE role='staff';"
          psql -h "${{ secrets.DB_HOST }}" -p "${{ secrets.DB_PORT }}" \
               -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" \
               -c "UPDATE users SET email='guest@example.com', hashed_password='${{ env.GUEST_HASH }}', is_email_verified=true WHERE role='guest' LIMIT 1;"

      - name: Verify (after reset)
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql -h "${{ secrets.DB_HOST }}" -p "${{ secrets.DB_PORT }}" \
               -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" \
               -c "SELECT id, email, role, is_email_verified FROM users ORDER BY role;"
          echo ""
          echo "Credentials after reset:"
          echo "  admin@allstay.rest  /  Admin@12345"
          echo "  staff@allstay.com   /  Staff@12345"
          echo "  guest@example.com   /  Guest@12345"
