name: Update Admin Credentials

on:
  workflow_dispatch:

jobs:
  update-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Update admin email in production DB
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql \
            -h "${{ secrets.DB_HOST }}" \
            -p "${{ secrets.DB_PORT }}" \
            -U "${{ secrets.DB_USER }}" \
            -d "${{ secrets.DB_NAME }}" \
            -c "UPDATE users SET email = 'admin@allstay.rest' WHERE email = 'admin@allstay.com' AND role = 'super_admin';"

          echo "✅ Admin email updated to admin@allstay.rest"

          # Verify
          psql \
            -h "${{ secrets.DB_HOST }}" \
            -p "${{ secrets.DB_PORT }}" \
            -U "${{ secrets.DB_USER }}" \
            -d "${{ secrets.DB_NAME }}" \
            -c "SELECT id, email, role FROM users WHERE role IN ('super_admin', 'staff') ORDER BY role;"
