name: Update Admin Credentials

on:
  workflow_dispatch:

jobs:
  update-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: sudo apt-get install -y postgresql-client python3-bcrypt

      - name: Generate bcrypt hashes
        run: |
          python3 - <<'EOF'
import bcrypt, os
pairs = [
    ("ADMIN_HASH", "Admin@2024"),
    ("STAFF_HASH", "Staff@2024"),
]
for var, pw in pairs:
    h = bcrypt.hashpw(pw.encode(), bcrypt.gensalt(rounds=12)).decode()
    with open(os.environ["GITHUB_ENV"], "a") as f:
        f.write(f"{var}={h}\n")
    print(f"{var} generated")
EOF

      - name: Upsert admin and staff users
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql \
            -h "${{ secrets.DB_HOST }}" \
            -p "${{ secrets.DB_PORT }}" \
            -U "${{ secrets.DB_USER }}" \
            -d "${{ secrets.DB_NAME }}" \
            <<SQL

          -- Update existing super_admin or insert if none exists
          DO \$\$
          BEGIN
            IF EXISTS (SELECT 1 FROM users WHERE role = 'super_admin') THEN
              UPDATE users
                SET email = 'admin@allstay.rest',
                    hashed_password = '${{ env.ADMIN_HASH }}',
                    is_email_verified = true,
                    full_name = 'Admin'
                WHERE role = 'super_admin'
                LIMIT 1;
            ELSE
              INSERT INTO users (full_name, email, hashed_password, role, is_email_verified)
              VALUES ('Admin', 'admin@allstay.rest', '${{ env.ADMIN_HASH }}', 'super_admin', true);
            END IF;

            IF EXISTS (SELECT 1 FROM users WHERE role = 'staff') THEN
              UPDATE users
                SET email = 'staff@allstay.rest',
                    hashed_password = '${{ env.STAFF_HASH }}',
                    is_email_verified = true,
                    full_name = 'Staff'
                WHERE role = 'staff'
                LIMIT 1;
            ELSE
              INSERT INTO users (full_name, email, hashed_password, role, is_email_verified)
              VALUES ('Staff', 'staff@allstay.rest', '${{ env.STAFF_HASH }}', 'staff', true);
            END IF;
          END
          \$\$;

          SQL

      - name: Verify users
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          psql \
            -h "${{ secrets.DB_HOST }}" \
            -p "${{ secrets.DB_PORT }}" \
            -U "${{ secrets.DB_USER }}" \
            -d "${{ secrets.DB_NAME }}" \
            -c "SELECT id, email, full_name, role, is_email_verified FROM users WHERE role IN ('super_admin', 'staff') ORDER BY role;"

          echo ""
          echo "============================================"
          echo "  Admin:  admin@allstay.rest  /  Admin@2024"
          echo "  Staff:  staff@allstay.rest  /  Staff@2024"
          echo "============================================"
