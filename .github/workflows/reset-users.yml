name: Reset User Credentials

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/hms_prod
          chmod 600 ~/.ssh/hms_prod
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run credential reset inside backend container
        run: |
          ssh -i ~/.ssh/hms_prod -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "CONTAINER=\$(sudo docker ps --filter 'name=hotel_backend' --format '{{.ID}}' | head -1)
             if [ -z \"\$CONTAINER\" ]; then echo 'Backend container not found'; exit 1; fi
             echo \"Using container: \$CONTAINER\"
             echo '' | base64 -d | sudo docker exec -i \"\$CONTAINER\" python3 -"

      - name: Print credentials
        run: |
          echo "============================================"
          echo "  Admin:  admin@allstay.rest  /  Admin@2024"
          echo "  Staff:  staff@allstay.rest  /  Staff@2024"
          echo "============================================"
