name: Reset User Credentials

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/hms_prod
          chmod 600 ~/.ssh/hms_prod
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Run credential reset inside backend container
        run: |
          SCRIPT=$(cat <<'PYEOF'
from app.core.database import SessionLocal
from app.core.security import hash_password
from app.models.user import User

db = SessionLocal()
try:
    admin = db.query(User).filter(User.role == "super_admin").first()
    if admin:
        admin.email = "admin@allstay.rest"
        admin.hashed_password = hash_password("Admin@2024")
        admin.is_email_verified = True
        admin.full_name = "Admin"
        print("Updated admin: admin@allstay.rest")
    else:
        admin = User(full_name="Admin", email="admin@allstay.rest",
                     hashed_password=hash_password("Admin@2024"),
                     role="super_admin", is_email_verified=True)
        db.add(admin)
        print("Created admin: admin@allstay.rest")

    staff = db.query(User).filter(User.role == "staff").first()
    if staff:
        staff.email = "staff@allstay.rest"
        staff.hashed_password = hash_password("Staff@2024")
        staff.is_email_verified = True
        staff.full_name = "Staff"
        print("Updated staff: staff@allstay.rest")
    else:
        staff = User(full_name="Staff", email="staff@allstay.rest",
                     hashed_password=hash_password("Staff@2024"),
                     role="staff", is_email_verified=True)
        db.add(staff)
        print("Created staff: staff@allstay.rest")

    db.commit()
    print("Done.")
except Exception as e:
    db.rollback()
    print(f"Error: {e}")
    raise
finally:
    db.close()
PYEOF
          )
          ENCODED=$(echo "$SCRIPT" | base64 -w 0)
          ssh -i ~/.ssh/hms_prod -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "CONTAINER=\$(sudo docker ps --filter 'name=hotel_backend' --format '{{.ID}}' | head -1)
             if [ -z \"\$CONTAINER\" ]; then echo 'Backend container not found'; exit 1; fi
             echo \"Using container: \$CONTAINER\"
             echo '$ENCODED' | base64 -d | sudo docker exec -i \"\$CONTAINER\" python3 -"

      - name: Print credentials
        run: |
          echo "============================================"
          echo "  Admin:  admin@allstay.rest  /  Admin@2024"
          echo "  Staff:  staff@allstay.rest  /  Staff@2024"
          echo "============================================"
