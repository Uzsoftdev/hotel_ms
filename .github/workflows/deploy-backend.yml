name: Deploy Backend

on:
  push:
    branches: [main, master]
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-stack.yml"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase image names
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${OWNER}/hotel-backend" >> $GITHUB_ENV
          echo "CELERY_IMAGE=ghcr.io/${OWNER}/hotel-celery" >> $GITHUB_ENV
          echo "IMAGE_REGISTRY=ghcr.io/${OWNER}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push celery image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.celery
          push: true
          tags: |
            ${{ env.CELERY_IMAGE }}:latest
            ${{ env.CELERY_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Swarm
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/hms_prod
          chmod 600 ~/.ssh/hms_prod
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ensure /opt/hotel exists on server
        run: |
          ssh -i ~/.ssh/hms_prod -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "sudo mkdir -p /opt/hotel && sudo chown \$(id -u):\$(id -g) /opt/hotel"

      - name: Sync stack file to server
        run: |
          rsync -az --checksum \
            -e "ssh -i ~/.ssh/hms_prod -o StrictHostKeyChecking=no" \
            docker-stack.yml docker \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/opt/hotel/

      - name: Set lowercase registry for deploy
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_REGISTRY=ghcr.io/${OWNER}" >> $GITHUB_ENV

      - name: Inject Google OAuth credentials into server .env
        run: |
          ssh -i ~/.ssh/hms_prod -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "grep -q '^GOOGLE_CLIENT_ID=' /opt/hotel/.env && \
              sed -i 's|^GOOGLE_CLIENT_ID=.*|GOOGLE_CLIENT_ID=964778505369-hfsqu7rrbicfibc5ks6hs6umh63v1u9v.apps.googleusercontent.com|' /opt/hotel/.env || \
              echo 'GOOGLE_CLIENT_ID=964778505369-hfsqu7rrbicfibc5ks6hs6umh63v1u9v.apps.googleusercontent.com' >> /opt/hotel/.env; \
             grep -q '^GOOGLE_CLIENT_SECRET=' /opt/hotel/.env && \
              sed -i 's|^GOOGLE_CLIENT_SECRET=.*|GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}|' /opt/hotel/.env || \
              echo 'GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}' >> /opt/hotel/.env; \
             grep -q '^GOOGLE_REDIRECT_URI=' /opt/hotel/.env && \
              sed -i 's|^GOOGLE_REDIRECT_URI=.*|GOOGLE_REDIRECT_URI=https://allstay.rest/auth/callback|' /opt/hotel/.env || \
              echo 'GOOGLE_REDIRECT_URI=https://allstay.rest/auth/callback' >> /opt/hotel/.env"

      - name: Deploy stack (rolling update)
        run: |
          ssh -i ~/.ssh/hms_prod -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "chmod +x /opt/hotel/docker/deploy.sh && \
             DEPLOY_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             DEPLOY_ACTOR='${{ github.actor }}' \
             IMAGE_TAG='${{ github.sha }}' \
             REGISTRY='${{ env.IMAGE_REGISTRY }}' \
             DOMAIN='allstay.rest' \
             ACME_EMAIL='sunnatakhmad@gmail.com' \
             /opt/hotel/docker/deploy.sh"
