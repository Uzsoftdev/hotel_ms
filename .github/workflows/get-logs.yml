name: Get Logs

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Name of the Docker service"
        required: true
        default: "hotel_backend"
      tail:
        description: "Number of lines to tail"
        required: false
        default: "100"

jobs:
  get-logs:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/hms_prod
          chmod 600 ~/.ssh/hms_prod
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Fetch docker logs
        run: |
          ssh -i ~/.ssh/hms_prod -o StrictHostKeyChecking=no \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "docker service logs ${{ github.event.inputs.service_name }} --tail ${{ github.event.inputs.tail }}"
